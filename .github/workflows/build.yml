name: Build and test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags='-s -w' -o vps-gateway-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/vps-gateway

      - name: Verify binary
        run: file vps-gateway-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: vps-gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release-artifacts:
    name: Prepare release artifacts
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: vps-gateway-linux-amd64
          path: dist

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: vps-gateway-linux-arm64
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum vps-gateway-linux-* > SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vps-gateway-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
