[Unit]
# ZAI-90D Test-only drop-in: re-assert the disposable gateway policy layer
# after every systemd-networkd start/restart. Reference copy; the live file
# is /etc/systemd/system/systemd-networkd.service.d/zai90d-policy-guard.conf.

[Service]
# Leading dash: a guard refusal must never fail systemd-networkd (host
# management protection outranks gateway re-assertion); failures stay
# visible in the journal. The bounded loop re-runs the idempotent guard
# until the client selector is verifiably present (networkd reconfigures
# the managed uplink AFTER the unit reports Started, so a single pass can
# lose the foreign-rule cleanup race); at most ~6 seconds, then exits
# nonzero for observability without restart loops.
ExecStartPost=-/bin/sh -c 'n=0; while [ $n -lt 6 ]; do /usr/local/libexec/test-gateway-routes guard && ip -4 rule show | grep -q "from 10.30.0.0/24 lookup 2030" && exit 0; n=$((n+1)); sleep 1; done; exit 1'
